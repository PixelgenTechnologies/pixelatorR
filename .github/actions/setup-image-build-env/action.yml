name: "setup-image-build-env"
description: "Install and setup Docker and authenticate with the Pixelgen container registries"
inputs:
  aws-role-to-assume:
    description: "The AWS IAM role to assume to get access to the AWS ECR registry"
    default: "arn:aws:iam::890888997283:role/GithubActionsRole"
  aws-role-session-name:
    description: "The name of the AWS IAM role session"
    default: "GitHubActions"
  aws-registry:
    description: "The AWS ECR registry to authenticate with"
    default: "890888997283.dkr.ecr.eu-north-1.amazonaws.com"
  push:
    description: "Whether to authenticate with container registries for pushing images"
    required: false
    default: "true"
  setup-qemu:
    description: "Whether to install QEMU static binaries"
    required: false
    default: "true"
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      if: inputs.setup-qemu == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Configure AWS credentials
      if: inputs.push == 'true'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-north-1
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-session-name: ${{ inputs.aws-role-session-name }}

    - name: Login to AWS ECR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.aws-registry }}

    - name: Login to GitHub Container Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
